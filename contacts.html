<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакти | LIDAN - Smart Business</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ХЕДЕР ТА НАВІГАЦІЯ */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 50;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            height: 80px;
        }
        .nav-wrapper {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 100%;
        }
        .logo {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #ffffff;
            text-decoration: none;
            line-height: 1.1;
        }
        .logo span {
            font-weight: 500;
            font-size: 10px;
            letter-spacing: 0.22em;
            display: block;
            margin-top: 5px;
            color: #a3a3a3;
        }
        nav { display: none; }
        nav a {
            color: #666666;
            text-decoration: none;
            margin-right: 32px;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.05em;
            transition: color 0.3s;
        }
        nav a:hover, nav a.active { color: #ffffff; }

        .btn-outline {
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: transparent;
            color: #ffffff;
            padding: 10px 24px;
            border-radius: 99px;
            font-size: 13px;
            font-weight: 500;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .btn-outline:hover { background: #ffffff; color: #000000; border-color: #ffffff; }

        /* СТИЛІ ФОРМИ */
        .main-content { padding: 180px 0 100px 0; }
        .section-title { max-width: 600px; margin-bottom: 48px; text-align: center; margin-left: auto; margin-right: auto; }
        .section-title h1 { font-size: 46px; font-weight: 700; letter-spacing: -0.04em; margin-bottom: 16px; color: #ffffff; }
        .section-title p { color: #888888; font-size: 16px; }

        .form-wrapper {
            max-width: 540px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.01);
            border-radius: 24px;
            padding: 48px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 40px 100px -30px rgba(255,255,255,0.01);
        }
        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; font-size: 14px; margin-bottom: 10px; color: #cccccc; font-weight: 500; }
        .form-control {
            width: 100%;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 16px;
            color: #ffffff;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        .form-control:focus { border-color: #ffffff; outline: none; }

        .btn-primary {
            background: #ffffff;
            color: #000000;
            padding: 16px 32px;
            border-radius: 99px;
            font-weight: 600;
            text-decoration: none;
            display: block;
            width: 100%;
            border: 1px solid #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 15px;
            text-align: center;
        }
        .btn-primary:hover { background: transparent; color: #ffffff; }

        @media (min-width: 768px) { nav { display: block; } }
    </style>
</head>
<body>

    <!-- НАВІГАЦІЯ -->
    <header>
        <div class="container" style="height: 100%;">
            <div class="nav-wrapper">
                <a href="index.html" class="logo">LIDAN<span>SMART BUSINESS</span></a>
                <nav>
                    <a href="index.html">Головна</a>
                    <a href="services.html">Послуги</a>
                    <a href="cases.html">Кейси</a>
                    <a href="contacts.html" class="active">Контакти</a>
                </nav>
                <div><a href="contacts.html" class="btn-outline">Залишити заявку ➔</a></div>
            </div>
        </div>
    </header>
    <!-- ОСНОВНИЙ КОНТЕНТ СТОРІНКИ -->
    <div class="container main-content">
        <div class="section-title">
            <h1>Запустіть ШІ у свій бізнес</h1>
            <p>Залиште заявку нижче, і ми проведемо безкоштовний технічний аудит ваших діалогів та процесів.</p>
        </div>

        <div class="form-wrapper">
            <form id="tgForm">
                <div class="form-group">
                    <label for="name">Ваше ім'я</label>
                    <input type="text" id="name" class="form-control" placeholder="Олександр" required>
                </div>
                <div class="form-group">
                    <label for="contact">Telegram або номер телефону</label>
                    <input type="text" id="contact" class="form-control" placeholder="@username або +380..." required>
                </div>
                <div class="form-group">
                    <label for="business">Ніша вашого бізнесу (або опис завдання)</label>
                    <input type="text" id="business" class="form-control" placeholder="Магазин одягу, онлайн-школа, логістика..." required>
                </div>
                <button type="submit" class="btn-primary">Надіслати заявку</button>
            </form>
        </div>
    </div>

    <!-- ПОДВАЛ -->
    <footer style="padding: 48px 0; border-top: 1px solid rgba(255, 255, 255, 0.08); text-align: center; color: #444444; font-size: 13px; margin-top: 80px;">
        <div class="container">
            <p>&copy; 2026 LIDAN - Smart Business. Всі права захищені. Створено сімейним digital-дуетом.</p>
        </div>
    </footer>

    <script>
        // ЛОГІКА ВІДПРАВКИ В TELEGRAM (ЖЕЛЕЗОБЕТОННА ВЕРСІЯ)
        document.getElementById('tgForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // ВСТАВ СВОЇ ДАНІ СЮДИ (З НОУТБУКА АБО ТЕЛЕФОНУ):
            const TG_TOKEN = "СЮДА_ВСТАВЬ_ТОКЕН_БОТА";
            const CHAT_ID = "СЮДА_ВСТАВЬ_СВОЙ_ID";

            const name = document.getElementById('name').value;
            const contact = document.getElementById('contact').value;
            const business = document.getElementById('business').value;

            const textMessage = `🔔 НОВА ЗАЯВКА З СТОРІНКИ КОНТАКТІВ!\n\n👤 Ім'я: ${name}\n📞 Контакт: ${contact}\n💼 Бізнес: ${business}`;
            const sendUrl = `https://telegram.org{TG_TOKEN}/sendMessage`;

            if(TG_TOKEN.includes("СЮДА")) {
                alert("Демо-режим: Форма готова! Щоб отримувати реальні сповіщення на телефон, встав токен бота в код файлу.");
                return;
            }

            fetch(sendUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ chat_id: CHAT_ID, text: textMessage })
            })
            .then(response => {
                if(response.ok) {
                    alert("Успішно! Заявка долетіла до твого Telegram.");
                    document.getElementById('tgForm').reset();
                } else {
                    alert("Помилка сервера Telegram. Перевірте токен або ID.");
                }
            })
            .catch(error => {
                alert("Помилка відправки! Перевірте інтернет-з'єднання. (Якщо ви на роботі, запит може блокуватися сисадміном. Протестуйте цей файл на телефоні через мобільну мережу).");
            });
        });
    </script>
</body>
</html>
